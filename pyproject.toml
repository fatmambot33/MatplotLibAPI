[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MatplotLibAPI"
version = "4.4.1"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "networkx>=2.8",
    "plotly>=5.10",
    "seaborn>=0.12",
    "scikit-learn>=1.1",
    "numpy>=1.23",
    "wordcloud>=1.9.1.1",
    "typing-extensions>=4.4; python_version < '3.10'",
]

[project.entry-points."matplotlibapi.plugins"]
core = "MatplotLibAPI.plugins:CorePlotsPlugin"

[project.optional-dependencies]
dev = [
    "pydocstyle",
    "pyright",
    "black==25.11.0",
    "pytest",
    "pytest-cov",
    "tomli",
]
mcp = [
    "mcp>=1.0.0",
]
plotly-export = [
    "kaleido>=0.2.1",
    "nbformat>=5.7",
]
plugin-dev = [
    "hatchling",
    "pytest",
]
all = [
    "mcp>=1.0.0",
    "kaleido>=0.2.1",
    "nbformat>=5.7",
]

[project.scripts]
matplotlibapi = "MatplotLibAPI.cli:main"
matplotlibapi-mcp = "MatplotLibAPI.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/MatplotLibAPI"]

[tool.pyright]
extraPaths = ["src"]

[tool.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
