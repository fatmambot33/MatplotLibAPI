[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MatplotLibAPI"
version = "4.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "networkx>=2.8",
    "plotly>=5.10",
    "seaborn>=0.12",
    "scikit-learn>=1.1",
    "kaleido>=0.2.1",
    "nbformat>=5.7",
    "numpy>=1.23",
    "wordcloud>=1.9.1.1",
]

[project.optional-dependencies]
dev = [
    "pydocstyle",
    "pyright",
    "black==25.11.0",
    "pytest",
    "pytest-cov",
    "tomli",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
matplotlibapi-mcp = "MatplotLibAPI.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/MatplotLibAPI"]

[tool.pyright]
extraPaths = ["src"]

[tool.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
