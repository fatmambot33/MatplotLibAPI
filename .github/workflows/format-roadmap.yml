name: Format roadmap branch

on:
  push:
    branches:
      - agent/schema-driven-agent-plotting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema-driven-agent-plotting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply pinned formatter
        run: |
          python -m pip install black==25.11.0
          python -m black src tests
      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/format-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply pinned Black formatting"
          git push origin HEAD:agent/schema-driven-agent-plotting
