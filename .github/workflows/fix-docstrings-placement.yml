name: Fix docstring placement

on:
  push:
    branches:
      - agent/schema-driven-agent-plotting

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema-driven-agent-plotting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize magic-method docstrings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/MatplotLibAPI/specs.py")
          lines = path.read_text().splitlines()

          expected = {
              "DataSource": "Validate that exactly one data source is configured.",
              "OutputSpec": "Validate output format and rendering limits.",
              "PlotSpec": "Validate and normalize the canonical plot request.",
          }

          for class_name, message in expected.items():
              class_index = next(
                  index
                  for index, line in enumerate(lines)
                  if line == f"class {class_name}:"
              )
              method_index = next(
                  index
                  for index in range(class_index + 1, len(lines))
                  if lines[index].startswith("    def __post_init__(self) -> None:")
              )
              insertion_index = method_index + 1
              while (
                  insertion_index < len(lines)
                  and lines[insertion_index].strip().startswith('"""')
                  and lines[insertion_index].strip().endswith('"""')
              ):
                  del lines[insertion_index]
              lines.insert(insertion_index, f'        """{message}"""')

          path.write_text("\n".join(lines) + "\n")
          PY
          python -m pip install black==25.11.0 pydocstyle
          python -m black src tests
          python -m pydocstyle src
      - name: Commit fixes and remove helper workflow
        run: |
          rm .github/workflows/fix-docstrings-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: correct plot contract docstring placement"
          git push origin HEAD:agent/schema-driven-agent-plotting
