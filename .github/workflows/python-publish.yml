name: Publish Python Package

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate release version
        id: version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          branch_name = os.environ["BRANCH_NAME"]
          prefix = "release/"
          if not branch_name.startswith(prefix):
              raise SystemExit(f"Unexpected release branch: {branch_name!r}.")
          branch_version = branch_name.removeprefix(prefix)
          if version != branch_version:
              raise SystemExit(
                  f"Release branch {branch_version!r} does not match package version {version!r}."
              )
          print(f"value={version}")
          PY

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*
