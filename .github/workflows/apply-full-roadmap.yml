name: Apply full roadmap

on:
  push:
    branches:
      - agent/full-roadmap-4-3-to-5-0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-roadmap-4-3-to-5-0
          fetch-depth: 0

      - name: Apply staged roadmap implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .roadmap/full-roadmap.part.* | base64 --decode > /tmp/full-roadmap.tar.gz
          tar -xzf /tmp/full-roadmap.tar.gz -C .
          rm -rf .roadmap .github/workflows/apply-full-roadmap.yml

      - name: Format Python sources
        run: |
          python -m pip install --disable-pip-version-check black==25.11.0
          black src tests scripts

      - name: Commit roadmap implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: execute data intelligence and plugin roadmap"
          git push origin HEAD:agent/full-roadmap-4-3-to-5-0
