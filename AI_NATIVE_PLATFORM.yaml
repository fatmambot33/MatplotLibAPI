version: 1
standard:
  repository: fatmambot33/ai-native-platform
  ref: 9556c8dcd2f3a7b7804aadbbf911da4309d13697
quality:
  typed: true
  tests: true
  docs: true
  examples: true
  compatibility: true
  security_scan: true
release:
  block_if_quality_fails: true
  block_if_plugin_invalid: true
agent:
  guarantees:
  - deterministic_tool_discovery
  - structured_outputs
  - issue_driven_improvement
  - ci_validated_changes
  - governed_autonomy
self_improvement:
  enabled: true
  github:
    issues: true
  autonomous:
    discover_improvements: true
    create_issues: true
    generate_pr: true
    run_ci: true
  governance:
    human_approval:
      breaking_changes: true
      security_changes: true
      credential_changes: true
      public_api_changes: true
      permission_expansion: true
      release_changes: true
product:
  name: MatplotLibAPI
  profile: full-platform
  ai_native: true
  description: Typed plotting SDK, CLI, and Codex plugin for deterministic visualization
    workflows.
plugin:
  enabled: true
  codex:
    supported: true
    marketplace: true
  discovery:
    entry_points: true
    manifest: true
    capabilities: true
  credentials:
    required: false
    local_only: true
    policy:
      never_store_remote: true
      never_commit: true
      never_echo: true
interfaces:
  sdk: true
  cli: true
  plugin: true
  json_schema: true
  openapi: false
evidence:
  mode: repository
  paths:
    readme: README.md
    tests: tests
    agent_instructions: AGENTS.md
    typing: pyproject.toml
    ci: .github/workflows/ci.yml
    sdk: src/MatplotLibAPI
    cli: src/MatplotLibAPI/cli.py
    schemas: schemas/ai-native-platform.schema.json
    plugin_manifest: plugins/matplotlibapi/.codex-plugin/plugin.json
    plugin_tests:
    - tests/test_plugins.py
    - tests/test_conformance.py
    docs: docs
    examples: examples
    ai_review_workflow: .github/workflows/ai-native-platform.yml
    security_evidence: .github/workflows/security.yml
    self_improvement_workflow: .github/workflows/ai-self-improvement.yml
    improvement_issue_template: .github/ISSUE_TEMPLATE/ai-improvement.yml
extensions:
  roadmap:
    current_release: 4.4.0
    data_intelligence: true
    plugin_conformance: true
    accessibility_presets: true
    migration_tooling: true
    v5_removal_not_before: '2027-02-06'
